<button
  type="button"
  class="btt"
  [class.is-visible]="visible()"
  [attr.aria-label]="label()"
  [attr.aria-hidden]="visible() ? null : 'true'"
  [tabindex]="visible() ? 0 : -1"
  (click)="scrollToTop()"
>
  <svg class="btt__ring" viewBox="0 0 58 58" aria-hidden="true">
    <circle class="btt__track" cx="29" cy="29" r="27" />
    <circle
      class="btt__bar"
      cx="29"
      cy="29"
      r="27"
      [attr.stroke-dasharray]="circumference"
      [attr.stroke-dashoffset]="dashOffset()"
    />
  </svg>
  <app-icon class="btt__arrow" name="arrow-right" [size]="22" />
</button>
