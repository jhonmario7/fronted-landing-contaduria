<svg
  [attr.width]="size()"
  [attr.height]="size()"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="1.75"
  stroke-linecap="round"
  stroke-linejoin="round"
  aria-hidden="true"
>
  @switch (name()) {
    @case ('calculator') {
      <rect x="5" y="2.5" width="14" height="19" rx="2" />

      <path d="M8.5 13h.01M12 13h.01M15.5 13h.01M8.5 17h.01M12 17h.01M15.5 17h.01" />

    @case ('receipt') {
      <path d="M5 3h14v18l-2.3-1.5L14.3 21 12 19.5 9.7 21l-2.4-1.5L5 21V3Z" />
      <path d="m15 8-6 7" />
      <path d="M9.5 8.5h.01M14.5 14.5h.01" />
    }
    @case ('scale') {
      <path d="M12 3v18M8 21h8M5 7h14" />
      <path d="M5 7 2.5 13a2.7 2.7 0 0 0 5 0L5 7ZM19 7l-2.5 6a2.7 2.7 0 0 0 5 0L19 7Z" />
    }
    @case ('search') {
      <path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h5" />
      <path d="M8.5 8h6M8.5 12h3" />
      <circle cx="16" cy="15" r="3.5" />
      <path d="m18.6 17.6 2.4 2.4" />

    @case ('building') {
      <path d="M4 21V4a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v17M15 9h4a1 1 0 0 1 1 1v11M2 21h20" />
      <path d="M8 7h3M8 11h3M8 15h3" />

      <path d="M19.5 12.6 12 20l-7.5-7.4A4.8 4.8 0 0 1 12 6.3a4.8 4.8 0 0 1 7.5 6.3Z" />
    }
    @case ('briefcase') {
      <rect x="3" y="7" width="18" height="13" rx="2" />
      <path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18" />
    }
    @case ('laptop') {
      <rect x="4" y="4" width="16" height="11" rx="1.5" />
      <path d="M2 19h20" />
    }
    @case ('store') {
      <path d="M3.5 9 5 4h14l1.5 5M4 9v11h16V9M3 9h18" />
      <path d="M9.5 20v-6h5v6" />
    }
    @case ('money') {
      <circle cx="12" cy="12" r="9" />
      <path
        d="M14.8 9.4c-.5-.9-1.5-1.4-2.8-1.4-1.6 0-2.8.8-2.8 2s1.2 1.6 2.8 2 2.8.8 2.8 2-1.2 2-2.8 2c-1.3 0-2.3-.5-2.8-1.4M12 6.5v11"
      />

    @case ('graduation') {
      <path d="m2 9 10-5 10 5-10 5L2 9Z" />
      <path d="M6 11v5c0 1.5 2.7 3 6 3s6-1.5 6-3v-5M22 9v6" />
    }
    @case ('handshake') {
      <!-- Trazado basado en Lucide "handshake" (ISC). -->
      <path d="m11 17 2 2a1 1 0 1 0 3-3" />
      <path
        d="m14 14 2.5 2.5a1 1 0 1 0 3-3l-3.88-3.88a3 3 0 0 0-4.24 0l-.88.88a1 1 0 1 1-3-3l2.81-2.81a5.79 5.79 0 0 1 7.06-.87l.47.28a2 2 0 0 0 1.42.25L21 4"

    }
    @case ('shield-check') {
      <path d="M12 2 4 5v6c0 5 3.5 8.5 8 11 4.5-2.5 8-6 8-11V5l-8-3Z" />
      <path d="m9 12 2 2 4-4" />
    }
    @case ('users') {
      <circle cx="9" cy="8" r="4" />
      <path
        d="M2 21v-1a6 6 0 0 1 6-6h2a6 6 0 0 1 6 6v1M16 3.5a4 4 0 0 1 0 7.5M22 21v-1a6 6 0 0 0-4-5.6"
      />
    }
    @case ('lightbulb') {
      <path d="M9 18h6M10 22h4" />
      <path
        d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1V18h6v-1.2c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2Z"
      />
    }
    @case ('award') {
      <circle cx="12" cy="9" r="6" />
      <path d="M8.5 14 7 22l5-3 5 3-1.5-8" />
    }
    @case ('sprout') {
      <path d="M12 22V12" />
      <path d="M12 12C12 7 8 4 3 4c0 5 4 8 9 8ZM12 14c0-4 3-7 8-7 0 4-3 7-8 7Z" />
    }
    @case ('chat') {
      <path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z" />
      <path d="M8.5 12h.01M12 12h.01M15.5 12h.01" />
    }
    @case ('calendar') {
      <rect x="3" y="4" width="18" height="18" rx="2" />
      <path d="M16 2v4M8 2v4M3 10h18" />
    }
    @case ('gear') {
      <circle cx="12" cy="12" r="3" />
      <circle cx="12" cy="12" r="7" />
      <path
        d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"
      />
    }
    @case ('info') {
      <circle cx="12" cy="12" r="9" />
      <path d="M12 16v-5M12 8h.01" />
    }
    @case ('chart') {
      <path d="M3 3v18h18" />
      <path d="M8 17v-5M13 17V8M18 17V6" />
    }
    @case ('target') {
      <circle cx="12" cy="12" r="9" />
      <circle cx="12" cy="12" r="5" />
      <circle cx="12" cy="12" r="1" fill="currentColor" stroke="none" />
    }
    @case ('document') {
      <path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8l-5-5Z" />
      <path d="M14 3v5h5M9 13h6M9 17h6" />

      <path
        fill="currentColor"
        stroke="none"
        d="M12.04 2c-5.52 0-10 4.48-10 10 0 1.86.52 3.6 1.4 5.1L2 22l5.1-1.34a9.9 9.9 0 0 0 4.94 1.33h.01c5.52 0 10-4.48 10-10S17.56 2 12.04 2Zm5.76 14.3c-.24.68-1.4 1.3-1.93 1.38-.49.08-1.11.11-1.8-.11-.41-.13-.94-.3-1.62-.6-2.85-1.23-4.7-4.1-4.84-4.29-.14-.19-1.16-1.54-1.16-2.93 0-1.4.73-2.08 1-2.37.24-.26.53-.32.7-.32.18 0 .35 0 .5.01.16.01.38-.06.6.46.23.55.78 1.9.85 2.04.07.14.12.3.02.48-.1.18-.15.3-.3.46-.14.16-.3.36-.43.48-.14.13-.29.27-.13.54.17.28.75 1.24 1.6 2.01 1.1 1 2.03 1.31 2.32 1.46.29.14.46.12.63-.07.18-.19.75-.87.96-1.16.2-.3.4-.25.68-.15.28.11 1.77.83 2.07.99.3.15.5.22.57.35.07.13.07.74-.17 1.42Z"
      />
    }
    @case ('mail') {
      <rect x="3" y="5" width="18" height="14" rx="3" />
      <path d="m4 7 8 6 8-6" />
    }
    @case ('clock') {
      <circle cx="12" cy="12" r="9" />
      <path d="M12 7v5l3 3" />
    }
    @case ('check') {
      <path d="M20 6 9 17l-5-5" />
    }
    @case ('arrow-right') {
      <path d="M5 12h14" />
      <path d="m13 6 6 6-6 6" />
    }
    @case ('chevron-down') {
      <path d="m6 9 6 6 6-6" />
    }
    @case ('menu') {
      <path d="M3 6h18M3 12h18M3 18h18" />
    }
    @case ('close') {
      <path d="M18 6 6 18M6 6l12 12" />
    }
    @case ('instagram') {
      <rect x="3" y="3" width="18" height="18" rx="5" />
      <circle cx="12" cy="12" r="4" />
      <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none" />
    }
    @case ('facebook') {
      <path d="M15 3h-2a5 5 0 0 0-5 5v2H6v4h2v7h4v-7h3l1-4h-4V8a1 1 0 0 1 1-1h3V3Z" />
    }
    @case ('linkedin') {
      <rect x="3" y="3" width="18" height="18" rx="3" />
      <path d="M8 10v7M8 7h.01M12 17v-4a2 2 0 0 1 4 0v4M12 10v7" />
    }
  }
</svg>
