<section id="por-que-elegirnos" class="section dark why">
  <img class="why__bg" [ngSrc]="whyUs.background.src" [alt]="whyUs.background.alt" fill />

  <div class="wrap why__inner">
    <app-section-header
      [eyebrow]="whyUs.eyebrow"
      [title]="whyUs.title"
      [subtitle]="whyUs.intro"
      align="center"
    />

    <!-- Recorrido como "How It Works" de la referencia: iconos en círculo dorado unidos por guiones. -->
    <ol class="why__pillars">
      @for (pillar of whyUs.pillars; track pillar.title; let last = $last) {
        <li data-icon-hover>
          <span class="why__ring"><app-icon [name]="pillar.icon" [size]="36" /></span>
          @if (!last) {
            <span class="why__link" aria-hidden="true"></span>
          }
          <h3>{{ pillar.title }}</h3>
        </li>
      }
    </ol>

    <p class="tagline why__closing">{{ whyUs.closing }}</p>
  </div>
</section>
