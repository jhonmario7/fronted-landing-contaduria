<main class="policy section">
  <div class="wrap policy__inner">
    <a class="policy__back" href="/">
      <app-icon name="arrow-right" [size]="18" />
      {{ page.backLabel }}
    </a>
    <h1>{{ page.title }}</h1>

    @for (section of legal.dataPolicySections; track section.heading) {
      <section>
        <h2>{{ section.heading }}</h2>
        @for (paragraph of section.paragraphs; track $index) {
          <p>{{ paragraph }}</p>
        }
      </section>
    } @empty {
      <p class="policy__pending">{{ page.pendingNotice }}</p>
    }
  </div>
</main>
