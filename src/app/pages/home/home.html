<main>
  <app-hero />
  <!-- Hidratación incremental: el HTML prerenderizado se ve completo desde el inicio;
       el JS de cada sección se activa solo cuando entra en pantalla. -->
  @defer (hydrate on viewport) {
    <app-about />
  }
  @defer (hydrate on viewport) {
    <app-team />
  }
  @defer (hydrate on viewport) {
    <app-services />
  }
  @defer (hydrate on viewport) {
    <app-why-us />
  }
  @defer (hydrate on viewport) {
    <app-process />
  }
  @defer (hydrate on viewport) {
    <app-contact />
  }
</main>
